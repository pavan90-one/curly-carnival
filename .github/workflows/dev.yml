name: Development CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  frontend-ci:
    name: Frontend Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

  backend-ci:
    name: Backend Services Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Backend Microservices
        run: |
          services=("api-gateway" "services/auth-service" "services/user-service" "services/product-service" "services/order-service" "services/payment-service" "services/notification-service")
          for svc in "${services[@]}"; do
            echo "::group::Validating backend/$svc"
            cd "$GITHUB_WORKSPACE/backend/$svc"
            npm install
            if [ -f "src/app.js" ]; then
              node -c src/app.js
            fi
            if [ -f "index.js" ]; then
              node -c index.js
            fi
            echo "::endgroup::"
          done

  docker-ci:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          cd backend
          docker compose config

      - name: Build Docker Microservice Images
        run: |
          cd backend
          docker compose build

  deploy-dev:
    name: Deploy to Development Environment
    needs: [frontend-ci, backend-ci, docker-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment: development
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Development Deployment Notification
        run: |
          echo "Successfully validated and ready to deploy dev pipeline build #${{ github.run_number }} (commit: ${{ github.sha }})"
