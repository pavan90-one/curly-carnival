services:
  mongodb:
    image: mongo:7
    ports: [ "27017:27017" ]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports: [ "4006:4006" ]
    environment:
      DATABASE_URL: mongodb://mongodb:27017/smart-commerce-auth
      MONGO_URI: mongodb://mongodb:27017/smart-commerce-auth
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports: [ "4001:4001" ]
    environment:
      DATABASE_URL: mongodb://mongodb:27017/smart-commerce-users
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    ports: [ "4002:4002" ]
    environment:
      DATABASE_URL: mongodb://mongodb:27017/smart-commerce-products
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    ports: [ "4003:4003" ]
    environment:
      DATABASE_URL: mongodb://mongodb:27017/smart-commerce-orders
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PRODUCT_SERVICE_URL: http://product-service:4002
      PAYMENT_SERVICE_URL: http://payment-service:4004
      USER_SERVICE_URL: http://user-service:4001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports: [ "4004:4004" ]
    environment:
      DATABASE_URL: mongodb://mongodb:27017/smart-commerce-payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports: [ "4005:4005" ]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
  api-gateway:
    build: ./api-gateway
    ports: [ "8081:8080" ]
    environment:
      AUTH_SERVICE_URL: http://auth-service:4006
      USER_SERVICE_URL: http://user-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      ORDER_SERVICE_URL: http://order-service:4003
      PAYMENT_SERVICE_URL: http://payment-service:4004
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports: [ "5672:5672", "15672:15672" ]
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  frontend:
    build: ../frontend
    ports: [ "5173:80" ]
    depends_on: [ api-gateway ]
volumes:
  mongo-data:
