apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: smart-commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: smart-commerce/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4004
          env:
            - name: DATABASE_URL
              value: mongodb://mongodb:27017/smart-commerce-payments
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
          readinessProbe:
            httpGet:
              path: /carnival
              port: 4004
            initialDelaySeconds: 3
