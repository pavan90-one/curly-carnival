apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: smart-commerce }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: smart-commerce/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: AUTH_SERVICE_URL, value: http://auth-service:4006 }
            - { name: USER_SERVICE_URL, value: http://user-service:4001 }
            - { name: PRODUCT_SERVICE_URL, value: http://product-service:4002 }
            - { name: ORDER_SERVICE_URL, value: http://order-service:4003 }
            - { name: PAYMENT_SERVICE_URL, value: http://payment-service:4004 }
            - { name: NOTIFICATION_SERVICE_URL, value: http://notification-service:4005 }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: smart-commerce }
spec: { selector: { app: api-gateway }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: smart-commerce }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: smart-commerce/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: smart-commerce }
spec: { selector: { app: frontend }, ports: [{ port: 80, targetPort: 80 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: smart-commerce, namespace: smart-commerce }
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
