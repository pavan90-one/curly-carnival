apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: smart-commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: smart-commerce/product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          env:
            - name: DATABASE_URL
              value: mongodb://mongodb:27017/smart-commerce-products
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
          readinessProbe:
            httpGet:
              path: /carnival
              port: 4002
            initialDelaySeconds: 3
