apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: smart-commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: smart-commerce/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          env:
            - name: DATABASE_URL
              value: mongodb://mongodb:27017/smart-commerce-orders
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:4002
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:4004
            - name: USER_SERVICE_URL
              value: http://user-service:4001
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
          readinessProbe:
            httpGet:
              path: /carnival
              port: 4003
            initialDelaySeconds: 3
