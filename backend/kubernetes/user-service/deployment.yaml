apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: smart-commerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: smart-commerce/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          env:
            - name: DATABASE_URL
              value: mongodb://mongodb:27017/smart-commerce-users
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
          readinessProbe:
            httpGet:
              path: /carnival
              port: 4001
            initialDelaySeconds: 3
